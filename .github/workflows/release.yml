name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Branch rule (stable from main, beta from develop)
        run: |
          v="${GITHUB_REF_NAME#v}"
          if [[ "$v" == *-* ]]; then branch=develop; else branch=main; fi
          git fetch origin "$branch"
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/$branch" || { echo "::error::$GITHUB_REF_NAME must be tagged on a commit reachable from $branch"; exit 1; }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # Publishing requires `changeset version` to have run on the tagged commit: it bumps package.json and writes
      # CHANGELOG.md from .changeset/*.md. Tag that commit as v<version>; a tag that does not match package.json fails here.
      - name: Tag matches package.json version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: pnpm lint
      - run: pnpm typecheck
      # Build first so the dist-based tests run instead of skipping.
      - run: pnpm build
      - run: pnpm vitest run
        env:
          REQUIRE_DIST: '1'
      - run: pnpm check
      - name: Publish (stable -> latest, prerelease -> beta)
        run: |
          v="${GITHUB_REF_NAME#v}"
          if [[ "$v" == *-* ]]; then tag=beta; else tag=latest; fi
          npm publish --provenance --access public --tag "$tag"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
